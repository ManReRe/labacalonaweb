name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PLACES_API_KEY }}
          PUBLIC_GOOGLE_PLACE_ID: ${{ secrets.PUBLIC_GOOGLE_PLACE_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Rebuilds independently (cheap — this site builds in ~1s) rather than
  # sharing the `build` job's artifact, since that's packaged in the
  # Pages-specific tarball format and not easily reusable here.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PLACES_API_KEY }}
          PUBLIC_GOOGLE_PLACE_ID: ${{ secrets.PUBLIC_GOOGLE_PLACE_ID }}

      # Internal links/images only (external domains skipped — see
      # package.json) so this is fast and never flaky from third-party
      # downtime. Blocks the deploy: a broken internal link is our bug.
      - name: Check internal links and images
        run: npm run test:links

      # Same crawl but including external links (CoverManager, Google
      # Maps, Instagram, mekriva.com). Informational only — a dead
      # external link is worth knowing about but shouldn't block a
      # deploy over another service's downtime.
      - name: Check external links (informational)
        run: npm run test:links:external
        continue-on-error: true

      # Blocks on accessibility/SEO regressions (deterministic, based on
      # markup) but only warns on performance/best-practices, which are
      # noisier in CI and partly outside our control (e.g. the
      # CoverManager iframe's own third-party cookies) — see
      # lighthouserc.json.
      - name: Lighthouse CI (accessibility + SEO gate)
        run: npm run lhci

  deploy:
    needs: [build, audit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
